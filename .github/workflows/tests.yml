name: Tests

on:
  pull_request:
  workflow_dispatch:

# A new push to the same PR cancels the run that is still in progress.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: smarthub
          POSTGRES_PASSWORD: smarthub
          POSTGRES_DB: smarthub_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U smarthub"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql+asyncpg://smarthub:smarthub@localhost:5432/smarthub_test
      JWT_SECRET: test-secret-key-not-for-production

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen

      - name: Lint
        run: |
          uv run ruff check app tests
          uv run ruff format --check app tests

      - name: Run tests
        run: uv run pytest -v
